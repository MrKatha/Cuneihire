name: Deploy Backend

on:
  push:
    branches:
      - master
      - main
    paths:
      - "backend/**"
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          script: |
            echo "Moving to project directory..."
            cd /srv/ismail_data/auto_apply_linkedin

            echo "Pulling latest changes..."
            git pull origin master

            echo "Installing backend dependencies..."
            cd backend
            npm i

            echo "Installing/upgrading JobSpy (Python) for open-source job sourcing..."
            # Best-effort, never fails the deploy -- see docs/architecture.md's "Open-source job sourcing"
            # section. jobspy.worker.js's own JobSpy-search calls will error with a clear message (surfaced
            # in that user's execution log) until this succeeds, but the rest of the app is unaffected
            # either way -- gated by JOBSPY_SOURCING_ENABLED_GLOBALLY (set true in production 2026-09-03;
            # jobspy_sourcing_enabled itself now defaults true for every account, no per-user opt-in any
            # more). python3 exists on this server by default but python3-pip does not (confirmed
            # live, 2026-08-31: "No module named pip") -- install it first, also best-effort. This Ubuntu
            # version also enforces PEP 668 (externally-managed-environment) by default, which blocks a
            # plain `pip install` outside a venv (confirmed live, same deploy) -- --break-system-packages
            # is the correct override for exactly this case (a small single-purpose backend server, not a
            # shared system where apt-vs-pip package conflicts matter).
            (command -v pip3 >/dev/null 2>&1 || sudo apt-get install -y -qq python3-pip) \
              && (python3 -m pip install --user --break-system-packages -U python-jobspy) \
              || echo "WARNING: python3/pip setup or the python-jobspy install failed -- JobSpy sourcing will error until this is fixed manually on the server."

            echo "Restarting PM2 process..."
            pm2 restart auto_apply_linkedin_backend --update-env
