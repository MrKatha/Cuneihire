name: Deploy Backend

on:
  push:
    branches:
      - master
      - main
    paths:
      - "backend/**"
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          script: |
            echo "Moving to project directory..."
            cd /srv/ismail_data/auto_apply_linkedin

            echo "Pulling latest changes..."
            git pull origin master

            echo "Installing backend dependencies..."
            cd backend
            npm i

            echo "Installing/upgrading JobSpy (Python) for open-source job sourcing..."
            # Best-effort, never fails the deploy -- see docs/architecture.md's "Open-source job sourcing"
            # section. jobspy.worker.js's own JobSpy-search calls will error with a clear message (surfaced
            # in that user's execution log) until this succeeds, but the rest of the app is unaffected
            # either way -- jobspy_sourcing_enabled defaults to false, so nothing calls this until an
            # account opts in.
            (command -v python3 >/dev/null 2>&1 && python3 -m pip install --user -U python-jobspy) \
              || echo "WARNING: python3/pip not available or install failed -- JobSpy sourcing will error until this is fixed manually on the server."

            echo "Restarting PM2 process..."
            pm2 restart auto_apply_linkedin_backend --update-env
